<body>

<h2>Fantasy Space Mudlib - Web Terminal</h2>

<div id="chat"></div>

<input id="msg" placeholder="Type here..." onkeypress="if(event.keyCode==13) sendMsg()">
<button onclick="sendMsg()">Send</button>

<script>
let ws;
let myID = "";

// 網頁載入後自動啟動連線程序
window.onload = function() {
    connect();
};

function log(msg) {
    const div = document.getElementById("chat");
    div.innerHTML += "<div>" + msg + "</div>";
    div.scrollTop = div.scrollHeight;
}

function connect() {
    // 1. 不再攜帶 username 參數，讓 MUDlib 決定身份
    ws = new WebSocket("ws://" + location.host + "/ws");

    ws.onopen = () => {
        log("🟢 已建立伺服器連線，等待回應...");
    };

    let isInputHidden = false;

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        // 處理隱藏輸入信號 (用於密碼)
        if (msg.payload === "__INPUT_HIDDEN__") {
            isInputHidden = true;
            document.getElementById("msg").type = "password";
            return;
        }

        switch (msg.type) {
            case "welcome":
                myID = msg.to;
                break;
            case "mud_text":
                // 渲染來自 MUD 引擎的文字
                const formattedText = msg.payload.replace(/\r\n/g, "<br>").replace(/\n/g, "<br>");
                log("<span style='color: #4CAF50;'>" + formattedText + "</span>");
                break;
            case "peer-joined":
                log("👋 [系統] 有新連線進入");
                break;
            case "peer-left":
                log("🚪 [系統] 某個連線已斷開");
                break;
            case "chat":
                log("💬 <b>" + (msg.username || "匿名者") + "</b>: " + msg.payload);
                break;
        }
    };

    ws.onclose = () => {
        log("🔴 連線中斷，2秒後嘗試重新連線...");
        setTimeout(connect, 2000);
    };
}

function sendMsg() {
    const msgInput = document.getElementById("msg");
    const msgText = msgInput.value;
    if (!msgText || !ws || ws.readyState !== WebSocket.OPEN) return;

    // 處理 UI 密碼遮蔽顯示
    if (document.getElementById("msg").type === "password") {
        log("<span style='color: #888;'>>> ******</span>");
    } else {
        log("<span style='color: #888;'>>> " + msgText + "</span>");
    }

    const msgObj = { type: "cmd", payload: msgText };
    ws.send(JSON.stringify(msgObj));
    msgInput.value = "";
    document.getElementById("msg").type = "text"; 
}
</script>
</body>
