<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>Fantasy Space MUD</title>
    <style>
        html, body { height: 100%; margin: 0; background: #000; color: #ccc; font-family: 'Consolas', monospace; overflow: hidden; }
        #wrapper { display: grid; grid-template-areas: "look" "send"; grid-template-rows: 1fr 60px; height: 100vh; width: 100vw; position: relative; }
        
        /* 🚀 覆蓋式面板設計 */
        .overlay-panel { 
            position: absolute; bottom: 70px; left: 15px; width: 320px; max-height: 70vh; 
            background: rgba(20, 20, 20, 0.95); border: 1px solid #4CAF50; border-radius: 8px;
            display: none; flex-direction: column; overflow: hidden; z-index: 500;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .overlay-panel.active { display: flex; }
        .panel-header { background: #333; padding: 10px 15px; font-weight: bold; color: #4CAF50; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; }
        .panel-content { flex: 1; overflow-y: auto; padding: 15px; }

        #look-area { grid-area: look; background: #000; overflow-y: auto; padding: 20px; font-size: 18px; line-height: 1.6; position: relative; }
        #send-area { grid-area: send; background: #111; display: flex; align-items: center; padding: 0 15px; gap: 10px; position: relative; border-top: 1px solid #333; }
        
        /* 🚀 下方工具列 */
        #toolbar { position: absolute; bottom: 60px; left: 15px; display: flex; gap: 5px; z-index: 1000; }
        .tool-btn { background: #222; border: 1px solid #4CAF50; color: #fff; padding: 5px 15px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; transition: all 0.2s; border-bottom: none; }
        .tool-btn:hover { background: #333; color: #4CAF50; }
        .tool-btn.active { background: #4CAF50; color: #fff; font-weight: bold; }

        .stat-box { background: #1a1a1a; border-radius: 4px; padding: 8px 12px; border-left: 4px solid #4CAF50; margin-bottom: 8px; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-value { font-weight: bold; color: #fff; display: block; font-size: 16px; }

        .cmd-group { margin-bottom: 15px; }
        .cmd-cat { cursor: pointer; color: #4CAF50; font-weight: bold; margin-bottom: 5px; display: block; }
        .cmd-list { display: none; padding-left: 10px; }
        .cmd-list.active { display: block; }
        .cmd-row { display: flex; margin-bottom: 4px; gap: 4px; }
        .btn-cmd { flex: 1; background: #222; color: #00ff00; border: 1px solid #333; padding: 5px; cursor: pointer; text-align: left; font-size: 14px; }
        .btn-cmd:hover { background: #333; border-color: #4CAF50; }
        
        #socials-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn-social { background: #222; border: 1px solid #333; border-radius: 6px; color: #fff; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: all 0.2s; }
        .btn-social:hover { background: #4CAF50; border-color: #fff; }

        #msg { flex: 1; background: #000; border: 1px solid #4CAF50; color: #00ff00; padding: 12px; font-size: 18px; outline: none; border-radius: 4px; }
        #btn-send { background: #4CAF50; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }

        #mc-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 200; }
        #mc-canvas { flex: 1; cursor: crosshair; image-rendering: pixelated; }
        #mc-msg-overlay { position: absolute; top: 60px; left: 20px; width: 300px; pointer-events: none; z-index: 250; }
        .mc-msg { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 5px; border-left: 3px solid #4CAF50; font-size: 14px; animation: fadeOut 5s forwards; }
        @keyframes fadeOut { 0% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }
        #mc-ui { height: 45px; background: #222; display: flex; align-items: center; padding: 0 15px; gap: 15px; border-bottom: 1px solid #444; }
        .mc-btn { background: #333; border: 1px solid #555; color: #fff; padding: 4px 12px; cursor: pointer; font-size: 13px; border-radius: 4px; }
        .mc-btn.active { background: #4CAF50; border-color: #fff; }

        #minimap-container { position: absolute; top: 20px; right: 20px; background: rgba(30, 30, 30, 0.9); border: 1px solid #4CAF50; border-radius: 8px; padding: 10px; display: grid; grid-template-columns: repeat(5, 32px); grid-template-rows: repeat(5, 32px); gap: 4px; z-index: 100; display: none; }
        .map-cell { background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .map-room { background: #333; }
        .map-center { background: #1976D2; color: #fff; }
        .map-exit { cursor: pointer; border-color: #4CAF50; }
        
        .cmd-link { color: #4CAF50; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite; pointer-events: none; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
        #suggestion-box { position: absolute; bottom: 65px; left: 15px; right: 15px; background: rgba(20, 20, 20, 0.98); border: 1px solid #4CAF50; max-height: 250px; overflow-y: auto; display: none; z-index: 1100; border-radius: 8px; }
        .suggest-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .suggest-item.active { background: #4CAF50; color: #fff; }
    </style>
</head>
<body>
<div id="wrapper">
    <div id="toolbar">
        <button class="tool-btn" onclick="togglePanel('panel-info', this)">📊 Status</button>
        <button class="tool-btn" onclick="togglePanel('panel-cmds', this)">📜 Commands</button>
        <button class="tool-btn" onclick="togglePanel('panel-socials', this)">🎭 Socials</button>
    </div>

    <div id="panel-info" class="overlay-panel">
        <div class="panel-header">Character Status <span onclick="togglePanel('panel-info')" style="cursor:pointer">×</span></div>
        <div id="info-area" class="panel-content"></div>
    </div>

    <div id="panel-cmds" class="overlay-panel">
        <div class="panel-header">Command List <span onclick="togglePanel('panel-cmds')" style="cursor:pointer">×</span></div>
        <div id="cmds-area" class="panel-content">Loading commands...</div>
    </div>

    <div id="panel-socials" class="overlay-panel">
        <div class="panel-header">Social Actions <span onclick="togglePanel('panel-socials')" style="cursor:pointer">×</span></div>
        <div id="socials-area" class="panel-content"></div>
    </div>

    <div id="look-area">
        <div id="minimap-container"></div>
        <div id="mc-container">
            <div id="mc-ui">
                <span style="color:#4CAF50; font-weight:bold;">MC Mode</span>
                <button class="mc-btn active" onclick="setMCAction('dig', this)">Dig (Click)</button>
                <button class="mc-btn" onclick="setMCAction('place', this)">Place (Click)</button>
                <select id="mc-block-type" style="background:#333; color:#fff; border:1px solid #666; padding:3px; border-radius:4px;">
                    <option value="stone">Stone</option>
                    <option value="grass">Grass</option>
                    <option value="wood">Wood</option>
                    <option value="leaves">Leaves</option>
                </select>
                <button class="mc-btn" onclick="toggleMCMode(false)" style="margin-left:auto; background:#833; border-color:#a55;">Exit World</button>
            </div>
            <div id="mc-msg-overlay"></div>
            <canvas id="mc-canvas"></canvas>
        </div>
        <div id="look-content"></div>
    </div>

    <div id="send-area">
        <div id="suggestion-box"></div>
        <input id="msg" placeholder="Type command..." autocomplete="off" autofocus>
        <button onclick="sendMsg()" id="btn-send">Send</button>
    </div>
</div>

<script>
    let ws, historyCmds = [], histIdx = -1, msgInput, suggestIdx = -1;
    let mcData = null, mcMode = false, mcAction = 'dig', mcZoom = 32;
    const mcColors = { stone: '#777', grass: '#4CAF50', wood: '#795548', leaves: '#2E7D32', player: '#2196F3', self: '#FFEB3B' };

    window.onload = () => {
        msgInput = document.getElementById("msg");
        initLocalization();
        initInputHandlers();
        connect();
        initStars();
    };

    function togglePanel(id, btn) {
        const panel = document.getElementById(id);
        const isActive = panel.classList.contains('active');
        
        // 關閉所有面板
        document.querySelectorAll('.overlay-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));

        if (!isActive) {
            panel.classList.add('active');
            if (btn) btn.classList.add('active');
        }
    }

    function initLocalization() {
        const isZH = (navigator.language || navigator.userLanguage).startsWith('zh');
        if (isZH) {
            msgInput.placeholder = "輸入指令...";
            document.getElementById("btn-send").innerText = "發送";
            document.querySelector('.tool-btn[onclick*="info"]').innerText = "📊 狀態";
            document.querySelector('.tool-btn[onclick*="cmds"]').innerText = "📜 指令";
            document.querySelector('.tool-btn[onclick*="socials"]').innerText = "🎭 社交";
        }
    }

    function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(protocol + "//" + location.host + "/ws");
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === "mud_text") {
                const p = msg.payload.trim();
                if (p === "__INPUT_HIDDEN__") { msgInput.type = "password"; return; }
                if (p.startsWith("{") && p.endsWith("}")) { 
                    try { handleUIData(JSON.parse(p)); } catch (err) { handleMultiJSON(p); }
                } else appendLook(p);
            }
        };
    }

    function handleMultiJSON(p) {
        const fixedP = p.replace(/\}\s*\{/g, "}\n{");
        fixedP.split('\n').forEach(line => {
            try { handleUIData(JSON.parse(line.trim())); } catch(e) {}
        });
    }

    function handleUIData(ui) {
        if (ui.ui === "score") {
            const d = ui.data;
            document.getElementById("info-area").innerHTML = `
                <div class="stat-box"><span class="stat-label">❤️ HP</span><span class="stat-value">${d.hp}/${d.max_hp}</span></div>
                <div class="stat-box"><span class="stat-label">✨ MP</span><span class="stat-value">${d.mp}/${d.max_mp}</span></div>
                <div class="stat-box"><span class="stat-label">💰 GOLD</span><span class="stat-value">${parseColorTags(d.money)}</span></div>
            `;
        } else if (ui.ui === "cmd_list") { renderCmdList(ui.data, ui.title); window.allCommands = ui.data; }
        else if (ui.ui === "socials") { renderSocials(ui.data, ui.title); window.allSocials = ui.data; }
        else if (ui.ui === "minimap") renderMiniMap(ui.data);
        else if (ui.ui === "nature") handleNatureData(ui.data);
        else if (ui.ui === "mc_map") handleMCMap(ui.data);
    }

    function renderCmdList(cats, title) {
        const area = document.getElementById("cmds-area");
        area.innerHTML = "";
        for (let c in cats) {
            let group = document.createElement("div"); group.className = "cmd-group";
            let cat = document.createElement("span"); cat.className = "cmd-cat"; cat.innerText = c;
            let list = document.createElement("div"); list.className = "cmd-list";
            cat.onclick = () => { list.classList.toggle('active'); };
            cats[c].forEach(cmd => {
                let row = document.createElement("div"); row.className = "cmd-row";
                row.innerHTML = `<button class="btn-cmd" onclick="fillInput('${cmd}')">${cmd}</button>`;
                list.appendChild(row);
            });
            group.appendChild(cat); group.appendChild(list); area.appendChild(group);
        }
    }

    function renderSocials(socials, title) {
        const grid = document.getElementById("socials-area");
        grid.innerHTML = `<div id='socials-grid'></div>`;
        const container = document.getElementById("socials-grid");
        for (let k in socials) {
            const btn = document.createElement("button"); btn.className = "btn-social";
            btn.onclick = () => sendCmd(k); btn.innerHTML = `<span>${socials[k].icon}</span>`;
            btn.title = k + ": " + socials[k].label; container.appendChild(btn);
        }
    }

    function handleMCMap(data) {
        if (!mcMode) toggleMCMode(true);
        mcData = data;
        renderMCMap();
    }

    function toggleMCMode(on) {
        mcMode = on;
        document.getElementById('mc-container').style.display = on ? 'flex' : 'none';
        document.getElementById('look-content').style.display = on ? 'none' : 'block';
        if (on) initMCCanvas();
    }

    function initMCCanvas() {
        const canvas = document.getElementById('mc-canvas');
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        canvas.onmousedown = (e) => {
            if (!mcData) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const selfPos = mcData.players[mcData.self_id];
            const centerX = canvas.width / 2, centerY = canvas.height / 2;
            const worldX = Math.floor((x - centerX) / mcZoom + selfPos[0]);
            const worldY = Math.floor(-(y - centerY) / mcZoom + selfPos[1]);
            if (e.button === 0) {
                if (mcAction === 'dig') sendCmd(`mc dig ${worldX} ${worldY}`);
                else sendCmd(`mc place ${worldX} ${worldY} ${document.getElementById('mc-block-type').value}`);
            }
        };
        canvas.oncontextmenu = (e) => e.preventDefault();
        canvas.onwheel = (e) => {
            e.preventDefault();
            if (e.deltaY < 0) mcZoom = Math.min(100, mcZoom + 4);
            else mcZoom = Math.max(10, mcZoom - 4);
            renderMCMap();
        };
        window.onresize = () => { if (mcMode) initMCCanvas(); };
    }

    function renderMCMap() {
        const canvas = document.getElementById('mc-canvas'); if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { width, height, blocks, players, self_id } = mcData;
        const selfPos = players[self_id] || [10, 10];
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2, centerY = canvas.height / 2;
        for (let key in blocks) {
            const [bx, by] = key.split(',').map(Number);
            const screenX = centerX + (bx - selfPos[0]) * mcZoom;
            const screenY = centerY - (by - selfPos[1]) * mcZoom;
            ctx.fillStyle = mcColors[blocks[key]] || '#fff';
            ctx.fillRect(screenX, screenY - mcZoom, mcZoom, mcZoom);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.strokeRect(screenX, screenY - mcZoom, mcZoom, mcZoom);
        }
        for (let pid in players) {
            const ppos = players[pid];
            const screenX = centerX + (ppos[0] - selfPos[0]) * mcZoom;
            const screenY = centerY - (ppos[1] - selfPos[1]) * mcZoom;
            ctx.fillStyle = (pid === self_id) ? mcColors.self : mcColors.player;
            ctx.beginPath(); ctx.arc(screenX + mcZoom/2, screenY - mcZoom/2, mcZoom/3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '12px Consolas'; ctx.textAlign = 'center';
            ctx.fillText(pid, screenX + mcZoom/2, screenY - mcZoom - 5);
        }
    }

    function renderMiniMap(d) {
        const m = document.getElementById("minimap-container"); if (!d.grid) return;
        let html = ""; const exits = new Set(d.exits || []);
        for (let y = 0; y < d.grid.length; y++) {
            for (let x = 0; x < d.grid[y].length; x++) {
                const cell = d.grid[y][x]; let content = "", classes = "map-cell map-" + cell, onClick = "";
                if (cell === "player") { content = "👤"; classes += " map-center"; }
                const dx = x - 2, dy = y - 2; let dir = (dx === 0 && dy === -1) ? "north" : (dx === 0 && dy === 1) ? "south" : (dx === -1 && dy === 0) ? "west" : (dx === 1 && dy === 0) ? "east" : "";
                if (dir && exits.has(dir) && cell !== "void") { classes += " map-exit"; onClick = `onclick="sendCmd('go ${dir}')"`; content = {north:"⬆️",south:"⬇️",west:"⬅️",east:"➡️"}[dir]; }
                html += `<div class="${classes}" ${onClick}>${content}</div>`;
            }
        }
        m.innerHTML = html; m.style.display = "grid";
    }

    function sendCmd(cmd) {
        if (!cmd) return; historyCmds.push(cmd); histIdx = historyCmds.length;
        ws.send(JSON.stringify({ type: "cmd", payload: cmd }));
        appendLook("<span style='color: #888;'>>> " + (msgInput.type === "password" ? "******" : cmd) + "</span>");
    }

    function appendLook(t) {
        // 🚀 核心優化：在 MC 模式下，不要在懸浮視窗顯示命令回饋 (>> ...)
        if (mcMode && !t.includes('>> ')) {
            popMCMessage(t);
        }

        const area = document.getElementById("look-area"), content = document.getElementById("look-content");
        let p = t; const hasTags = /<[a-z/][^>]*>/i.test(t);
        if (hasTags) p = p.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gmi, " [Blocked] ").replace(/\bon\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]*)/gmi, "");
        else p = p.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        p = parseColorTags(p).replace(/\[(.*?)\]/g, (m, p1) => {
            let pts = p1.split('|'), d = pts[0], c = pts.length > 1 ? pts[1] : pts[0];
            return `<span class="cmd-link" onclick="sendCmd('${c.replace(/'/g, "\\'")}')">${d}</span>`;
        });
        const div = document.createElement("div"); if (!hasTags) div.style.whiteSpace = "pre-wrap";
        div.innerHTML = p; content.appendChild(div); setTimeout(() => { area.scrollTop = area.scrollHeight; }, 10);
    }

    function parseColorTags(t) {
        const cmap = { 'r': '#ff5555', 'g': '#55ff55', 'b': '#5555ff', 'y': '#ffff55', 'c': '#55ffff', 'm': '#ff55ff', 'w': '#ffffff', 'gr': '#888888', 'n': 'inherit' };
        let open = 0; let res = t.replace(/\{([rgbymcwgn]|gr)\}/g, (m, tag) => {
            if (tag === 'n') { let s = ''; while (open > 0) { s += '</span>'; open--; } return s; }
            if (cmap[tag]) { open++; return `<span style="color: ${cmap[tag]}">`; } return m;
        });
        while (open > 0) { res += '</span>'; open--; } return res;
    }

    function initStars() {
        const area = document.getElementById("look-area");
        for (let i = 0; i < 40; i++) {
            const s = document.createElement("div"); s.className = "star";
            const sz = (Math.random() * 2 + 1) + "px"; s.style.width = sz; s.style.height = sz;
            s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
            s.style.setProperty("--duration", (Math.random() * 3 + 2) + "s"); area.appendChild(s);
        }
    }

    function initInputHandlers() {
        // 🚀 核心：全域鍵盤監聽 (處理 WASD 移動)
        window.addEventListener('keydown', (e) => {
            if (mcMode) {
                // 如果正在輸入框打字，則不觸發 WASD 移動
                if (document.activeElement === msgInput && msgInput.value !== "") return;
                
                const key = e.key.toLowerCase();
                let dir = { w: 'n', s: 's', a: 'w', d: 'e', arrowup: 'n', arrowdown: 's', arrowleft: 'w', arrowright: 'e' }[key];
                
                if (dir) {
                    e.preventDefault();
                    sendCmd(`mc move ${dir}`);
                    return;
                }
            }

            // 原有的輸入框邏輯
            if (document.activeElement === msgInput) {
                if (e.key === "ArrowUp") { if (histIdx > 0) { histIdx--; msgInput.value = historyCmds[histIdx]; } }
                else if (e.key === "ArrowDown") { if (histIdx < historyCmds.length - 1) { histIdx++; msgInput.value = historyCmds[histIdx]; } else { histIdx = historyCmds.length; msgInput.value = ""; } }
                else if (e.key === "Enter") sendMsg();
            }
        });
    }

    function sendMsg() { const v = msgInput.value.trim(); if (!v) return; sendCmd(v); msgInput.value = ""; msgInput.type = "text"; msgInput.focus(); }
    function fillInput(c) { msgInput.value = c + " "; msgInput.focus(); }
    function handleNatureData(d) {
        document.body.style.background = d.is_day ? "linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d)" : "linear-gradient(to bottom, #000000, #0f0c29, #000000)";
    }
    document.addEventListener('click', (e) => {
        if (['INPUT','BUTTON','A','SELECT','OPTION'].includes(e.target.tagName) || e.target.classList.contains('cmd-link') || e.target.classList.contains('map-exit')) return;
        if (!window.getSelection().toString() && msgInput) msgInput.focus();
    });
    function setMCAction(a, btn) {
        mcAction = a;
        document.querySelectorAll('.mc-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function popMCMessage(msg) {
        const container = document.getElementById('mc-msg-overlay');
        if (!container) return;
        const div = document.createElement('div');
        div.className = 'mc-msg';
        // 簡單過濾 HTML 與 ANSI 標籤
        div.innerText = msg.replace(/<[^>]*>?/gm, '').replace(/\{[a-z]{1,2}\}/g, '');
        container.appendChild(div);
        setTimeout(() => div.remove(), 5000);
    }
</script>
</body>
</html>
