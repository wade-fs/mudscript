<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>Fantasy Space MUD</title>
    <style>
        /* 1. CSS Grid 多區塊佈局 */
        html, body { height: 100%; margin: 0; background: #000; color: #ccc; font-family: 'Consolas', monospace; overflow: hidden; }
        
        #wrapper {
            display: grid;
            grid-template-areas: 
                "cmds look info"
                "send send send";
            grid-template-rows: 1fr 60px;
            grid-template-columns: 240px 1fr 240px;
            height: 100vh;
            gap: 4px;
        }

        #info-area { grid-area: info; background: #1a1a1a; border: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        #cmds-area { grid-area: cmds; background: #1a1a1a; border: 1px solid #333; overflow-y: auto; padding: 10px; }
        /* 🚩 Look 區必須設定 position: relative，讓小地圖可以在裡面絕對定位 */
        #look-area { grid-area: look; background: #000; border: 1px solid #4CAF50; overflow-y: auto; padding: 20px; font-size: 18px; line-height: 1.6; position: relative; }
        #send-area { grid-area: send; background: #222; display: flex; align-items: center; padding: 0 15px; gap: 10px; }

        .stat-box { background: #222; border-radius: 4px; padding: 8px 12px; border-left: 4px solid #4CAF50; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-value { font-weight: bold; color: #fff; display: block; font-size: 16px; }

        .cmd-group { margin-bottom: 15px; }
        .cmd-row { display: flex; margin-bottom: 4px; gap: 4px; }
        .btn-cmd { flex: 1; background: #333; color: #00ff00; border: 1px solid #444; padding: 4px; cursor: pointer; text-align: left; }
        .btn-help { background: #444; color: #fff; border: none; padding: 4px 8px; cursor: help; border-radius: 2px; }
        
        #msg { flex: 1; background: #000; border: 1px solid #4CAF50; color: #00ff00; padding: 10px; font-size: 18px; outline: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; }

        /* 🚀 迷你地圖專用樣式 */
        #minimap-container {
            position: sticky; /* 改用 sticky 讓它在滾動時儘量留在頂部 */
            float: right;
            top: 0;
            right: 0;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(5, 30px);
            grid-template-rows: repeat(5, 30px);
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
            margin-left: 20px;
            margin-bottom: 20px;
        }

        .map-cell { background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555; user-select: none; }
        .map-room { background: #444; border-color: #666; }
        .map-safe { background: #2E7D32; border-color: #4CAF50; }
        .map-forge { background: #F57F17; border-color: #FF9800; }
        .map-lab { background: #6A1B9A; border-color: #AB47BC; }
        .map-fog { background: #111; border-style: dashed; }
        .map-void { background: transparent; border: none; }
        .map-exit { cursor: pointer; transition: filter 0.2s; }
        .map-exit:hover { filter: brightness(1.3); }
        .map-center { background: #1976D2; color: #fff; border-color: #64B5F6; font-size: 16px; }

        /* 點擊指令樣式 */
        .cmd-link { color: #4CAF50; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .cmd-link:hover { color: #8BC34A; }

        /* 🚀 幻想太空主題特效 */
        .neon-text {
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #00ffff,
                0 0 30px #00ffff,
                0 0 40px #00ffff;
            animation: neon-pulse 2s infinite;
        }

        .neon-purple {
            color: #f0f;
            text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
        }

        .neon-blue {
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
        }

        .neon-gold {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
        }

        @keyframes neon-pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px #fff, 0 0 20px #00ffff; }
            50% { opacity: 0.8; text-shadow: 0 0 10px #fff, 0 0 40px #00ffff; }
        }

        .typing-text {
            display: inline-block;
            overflow: hidden;
            border-right: .15em solid orange;
            white-space: nowrap;
            margin: 0 auto;
            letter-spacing: .15em;
            animation: 
                typing 3.5s steps(40, end),
                blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: orange; }
        }

        .space-bg {
            background: linear-gradient(to bottom, #000000 0%, #020107 100%) !important;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) infinite;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body class="space-bg">

<div id="wrapper">
    <div id="cmds-area">Loading commands...</div>
    <div id="look-area">
        <div id="minimap-container"></div>
        <div id="look-content"></div>
    </div>
    <div id="info-area">Waiting for updates...</div>
    <div id="send-area">
        <input id="msg" placeholder="Type command..." autocomplete="off" autofocus>
        <button onclick="sendMsg()" id="btn-send">Send</button>
    </div>
</div>

<script>
    let ws;
    let historyCmds = [];
    let histIdx = -1;

    window.onload = () => { 
        initLocalization();
        connect(); 
    };

    function initLocalization() {
        const lang = navigator.language || navigator.userLanguage;
        const isZH = lang.startsWith('zh');
        const isCN = lang === 'zh-CN';
        
        let msg1 = ">>> System initialization complete...";
        let msg2 = ">>> Connecting to the interstellar network...";
        let msg3 = ">>> Welcome to the future fantasy world.";
        let note = "[ This system is for development and testing purposes only ]";
        let loading_cmds = "Loading commands...";
        let waiting_info = "Waiting for updates...";
        let placeholder = "Type command...";
        let btn_send = "Send";

        if (isZH) {
            if (isCN) {
                msg1 = ">>> 系统初始化完成...";
                msg2 = ">>> 连结星际网络中...";
                msg3 = ">>> 欢迎來到未来的幻想世界。";
                note = "[ 本系统仅供开发与测试使用 ]";
                loading_cmds = "载入指令中...";
                waiting_info = "等待状态更新...";
                placeholder = "输入指令...";
                btn_send = "发送";
            } else {
                msg1 = ">>> 系統初始化完成...";
                msg2 = ">>> 連結星際網路中...";
                msg3 = ">>> 歡迎來到未來的幻想世界。";
                note = "[ 本系統僅供開發與測試使用 ]";
                loading_cmds = "載入指令中...";
                waiting_info = "等待狀態更新...";
                placeholder = "輸入指令...";
                btn_send = "發送";
            }
        }

        const cmdsArea = document.getElementById("cmds-area");
        if (cmdsArea) cmdsArea.innerText = loading_cmds;
        
        const infoArea = document.getElementById("info-area");
        if (infoArea) infoArea.innerText = waiting_info;
        
        const msgInp = document.getElementById("msg");
        if (msgInp) msgInp.placeholder = placeholder;
        
        const btnSend = document.getElementById("btn-send");
        if (btnSend) btnSend.innerText = btn_send;

        const container = document.getElementById("init-msgs");
        if (container) {
            container.innerHTML = `
                <div class="typing-text" style="color: #00ff00;">${msg1}</div><br>
                <div class="typing-text" style="color: #00ff00; animation-delay: 1s;">${msg2}</div><br>
                <div class="typing-text" style="color: #00ff00; animation-delay: 2s;">${msg3}</div>
            `;
        }

        const noteElem = document.getElementById("dev-note");
        if (noteElem) {
            noteElem.innerText = note;
        }
    }

    const msgInput = document.getElementById("msg");
    msgInput.onkeydown = (e) => {
        if (e.key === "ArrowUp") {
            if (histIdx > 0) { histIdx--; msgInput.value = historyCmds[histIdx]; }
        } else if (e.key === "ArrowDown") {
            if (histIdx < historyCmds.length - 1) { histIdx++; msgInput.value = historyCmds[histIdx]; }
            else { histIdx = historyCmds.length; msgInput.value = ""; }
        } else if (e.key === "Enter") {
            sendMsg();
        }
    };

    function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(protocol + "//" + location.host + "/ws");
        
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "mud_text") {
                const payload = msg.payload.trim();

                if (payload === "__INPUT_HIDDEN__") {
                    msgInput.type = "password";
                    return;
                }

                if (payload.startsWith("{") && payload.endsWith("}")) {
                    try {
                        const uiData = JSON.parse(payload);
                        handleUIData(uiData);
                    } catch (e) { appendLook(payload); }
                } else {
                    appendLook(payload);
                }
            }
        };
    }

    function handleUIData(ui) {
        if (ui.ui === "score") {
            const data = ui.data;
            document.getElementById("info-area").innerHTML = `
                <div class="stat-box"><span class="stat-label">❤️ ${data.label_hp || 'HP'}</span><span class="stat-value">${data.hp}/${data.max_hp}</span></div>
                <div class="stat-box"><span class="stat-label">✨ ${data.label_mp || 'MP'}</span><span class="stat-value">${data.mp}/${data.max_mp}</span></div>
                <div class="stat-box"><span class="stat-label">💰 ${data.label_wealth || 'GOLD'}</span><span class="stat-value">${data.money}</span></div>
                <div class="stat-box"><span class="stat-label">⚔️ ${data.label_atk || 'ATK'}</span><span class="stat-value">${data.atk}</span></div>
            `;
        } else if (ui.ui === "cmd_list") {
            renderCmdList(ui.data, ui.title);
        } else if (ui.ui === "minimap") {
            renderMiniMap(ui.data); 
        } else if (ui.ui === "nature") {
            handleNatureData(ui.data);
        }
    }

    function handleNatureData(data) {
        const body = document.body;
        
        // 1. 處理日夜背景
        if (data.is_day) {
            body.style.background = "linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d)"; // 黎明/白天感
            body.style.backgroundAttachment = "fixed";
        } else {
            body.style.background = "linear-gradient(to bottom, #000000, #0f0c29, #000000)"; // 深夜感
            body.style.backgroundAttachment = "fixed";
        }

        // 2. 處理天氣特效
        renderWeatherEffect(data.weather);
    }

    let weatherInterval;
    function renderWeatherEffect(weather) {
        const container = document.getElementById("look-area");
        // 清除舊的天氣元素 (保留星星)
        const oldParticles = container.querySelectorAll(".weather-particle");
        oldParticles.forEach(p => p.remove());

        if (weather === "clear" || weather === "cloudy") return;

        let char = "·";
        let color = "#fff";
        if (weather === "rainy") { char = "│"; color = "#55f"; }
        if (weather === "snowy") { char = "❄"; color = "#fff"; }
        if (weather === "foggy") { 
            container.style.filter = "blur(2px) grayscale(50%)";
            return;
        } else {
            container.style.filter = "none";
        }

        for (let i = 0; i < 30; i++) {
            const p = document.createElement("div");
            p.className = "weather-particle";
            p.innerText = char;
            p.style.position = "absolute";
            p.style.color = color;
            p.style.left = Math.random() * 100 + "%";
            p.style.top = "-20px";
            p.style.fontSize = (Math.random() * 10 + 10) + "px";
            p.style.opacity = Math.random();
            p.style.pointerEvents = "none";
            
            const duration = Math.random() * 2 + 1;
            p.style.transition = `top ${duration}s linear, opacity ${duration}s ease-in`;
            
            container.appendChild(p);

            // 動畫
            setTimeout(() => {
                p.style.top = "100%";
                p.style.opacity = "0";
            }, 100);

            // 移除
            setTimeout(() => p.remove(), duration * 1000 + 200);
        }
    }

    function renderCmdList(categories, title) {
        const area = document.getElementById("cmds-area");
        const listTitle = title || "📜 Command List";
        area.innerHTML = `<h4>${listTitle}</h4>`;
        for (let cat in categories) {
            let div = document.createElement("div");
            div.className = "cmd-group";
            div.innerHTML = `<b>${cat}</b>`;
            categories[cat].forEach(cmd => {
                let row = document.createElement("div");
                row.className = "cmd-row";
                row.innerHTML = `
                    <button class="btn-cmd" onclick="fillInput('${cmd}')">${cmd}</button>
                    <button class="btn-help" title="查看說明" onclick="askHelp('${cmd}')">?</button>
                `;
                div.appendChild(row);
            });
            area.appendChild(div);
        }
    }

    function renderMiniMap(data) {
        const mapDiv = document.getElementById("minimap-container");
        if (!data.grid) return; // 需要後端支援 grid 封包

        let html = "";
        
        // 設定中心點與可用出口
        const exits = new Set(data.exits || []);
        
        // grid 是一個二維陣列 [5][5]，每個元素是狀態字串
        for (let y = 0; y < data.grid.length; y++) {
            const row = data.grid[y];
            for (let x = 0; x < row.length; x++) {
                const cell = row[x];
                let content = "";
                let classes = "map-cell map-" + cell;
                let onClick = "";

                if (cell === "player") {
                    content = "👤";
                    classes += " map-center";
                    mapDiv.title = data.center_name || "";
                } else if (cell === "safe") {
                    content = "S";
                } else if (cell === "forge") {
                    content = "F";
                } else if (cell === "lab") {
                    content = "L";
                } else if (cell === "fog") {
                    content = "?";
                }

                // 計算與中心的相對位置 (假設中心是 2,2)
                const dx = x - 2;
                const dy = y - 2; // 注意 y 的方向，0 是北(上)
                let dir = "";
                if (dx === 0 && dy === -1) dir = "north";
                else if (dx === 0 && dy === 1) dir = "south";
                else if (dx === -1 && dy === 0) dir = "west";
                else if (dx === 1 && dy === 0) dir = "east";

                // 如果是相鄰一格，且有出口，則加上可點擊連結與顏色
                if (dir !== "" && exits.has(dir) && cell !== "void" && cell !== "fog") {
                    classes += " map-exit";
                    onClick = `onclick="sendCmd('go ${dir}')"`;
                    // 可以加上方向箭頭
                    if (dir === "north") content = "⬆️";
                    if (dir === "south") content = "⬇️";
                    if (dir === "west") content = "⬅️";
                    if (dir === "east") content = "➡️";
                }

                html += `<div class="${classes}" ${onClick}>${content}</div>`;
            }
        }

        mapDiv.innerHTML = html;
        mapDiv.style.display = "grid";
    }

    function getDirLabel(dir) {
        const labels = { north:"北", south:"南", east:"東", west:"西", up:"上", down:"下" };
        return labels[dir] || dir.substring(0, 1).toUpperCase();
    }

    function sendCmd(cmd) {
        historyCmds.push(cmd);
        histIdx = historyCmds.length;
        ws.send(JSON.stringify({ type: "cmd", payload: cmd }));
        
        const displayVal = msgInput.type === "password" ? "******" : cmd;
        appendLook("<span style='color: #888;'>>> " + displayVal + "</span>");
    }

    function fillInput(cmd) {
        msgInput.value = cmd + " ";
        msgInput.focus();
    }

    function askHelp(cmd) {
        ws.send(JSON.stringify({ type: "cmd", payload: "help " + cmd }));
    }

    function appendLook(text) {
        const area = document.getElementById("look-area");
        const content = document.getElementById("look-content");
        
        let processedText = text;
        const hasTags = /<[a-z/][^>]*>/i.test(text);

        if (hasTags) {
            // 1. 如果包含 HTML 標籤，進行安全性過濾
            // 移除 script, iframe 等危險元素，但不轉義整個字串以保留 Logo 的 <pre> 結構
            processedText = processedText.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gmi, " [Blocked Script] ")
                                         .replace(/\bon\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]*)/gmi, "")
                                         .replace(/<(iframe|object|embed|form)\b[^>]*>([\s\S]*?)<\/\1>/gmi, " [Blocked Element] ");
        } else {
            // 2. 純文字模式：進行完整的 HTML 轉義
            processedText = processedText.replace(/&/g, "&amp;")
                                         .replace(/</g, "&lt;")
                                         .replace(/>/g, "&gt;");
        }

        // 3. Color Tags: {r}text{n} - 使用更精確的匹配
        const colorMap = {
            'r': '#ff5555', 'g': '#55ff55', 'b': '#5555ff',
            'y': '#ffff55', 'c': '#55ffff', 'm': '#ff55ff',
            'w': '#ffffff', 'gr': '#888888', 'n': 'inherit'
        };

        let openSpans = 0;
        processedText = processedText.replace(/\{([rgbymcwgn]|gr)\}/g, (match, tag) => {
            if (tag === 'n') {
                if (openSpans > 0) {
                    openSpans--;
                    return '</span>';
                }
                return '';
            }
            if (colorMap[tag]) {
                openSpans++;
                return `<span style="color: ${colorMap[tag]}">`;
            }
            return match;
        });

        while (openSpans > 0) {
            processedText += '</span>';
            openSpans--;
        }

        // 4. Command links: [顯示名稱|指令]
        processedText = processedText.replace(/\[(.*?)\]/g, (match, p1) => {
            let parts = p1.split('|');
            let display = parts[0];
            let command = parts.length > 1 ? parts[1] : parts[0];
            let cleanCommand = command.replace(/\{.*?\}/g, '').replace(/'/g, "\\'");
            return `<span class="cmd-link" onclick="sendCmd('${cleanCommand}')">${display}</span>`;
        });

        // 5. 渲染與換行處理
        const newMsg = document.createElement("div");
        // 如果是純文字，我們強制套用 pre-wrap 樣式以保護 ASCII 格式
        if (!hasTags) {
            newMsg.style.whiteSpace = "pre-wrap";
            newMsg.style.wordBreak = "break-all";
            newMsg.style.fontFamily = "'Consolas', 'Courier New', monospace";
        }
        
        newMsg.innerHTML = processedText;
        content.appendChild(newMsg);
        
        setTimeout(() => {
            area.scrollTop = area.scrollHeight;
        }, 10);
    }

    function initStars() {
        const lookArea = document.getElementById("look-area");
        for (let i = 0; i < 60; i++) {
            const star = document.createElement("div");
            star.className = "star";
            const size = (Math.random() * 2 + 1) + "px";
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";
            star.style.setProperty("--duration", (Math.random() * 3 + 2) + "s");
            lookArea.appendChild(star);
        }
    }
    setTimeout(initStars, 500);

    function sendMsg() {
        const val = msgInput.value.trim();
        if (!val) return;
        sendCmd(val);
        msgInput.value = "";
        msgInput.type = "text";
        msgInput.focus();
    }
// 自動聚焦：點擊頁面任何地方後，讓焦點回到輸入框
document.addEventListener('click', (e) => {
    // 取得點擊的元素標籤名稱
    const tagName = e.target.tagName.toUpperCase();
    
    // 如果點擊的是按鈕、輸入框本身、或是具有 cmd-link 類別的元素，則不干預
    // 這樣可以保留原本按鈕點擊的功能
    if (
        tagName === 'INPUT' || 
        tagName === 'BUTTON' || 
        tagName === 'A' || 
        e.target.classList.contains('cmd-link') ||
        e.target.classList.contains('map-exit')
    ) {
        return;
    }

    // 取得選取的文字，如果使用者正在選取（複製）文字，則不要搶走焦點
    const selection = window.getSelection().toString();
    if (selection) return;

    // 回到輸入框
    msgInput.focus();
});
// 當網頁載入完成後，自動將焦點移至輸入框
window.addEventListener('load', () => {
    // 延遲一小段時間確保 DOM 渲染完全
    setTimeout(() => {
        const msgInput = document.getElementById("msg-input");
        if (msgInput) {
            msgInput.focus();
        }
    }, 100);
});
</script>
</body>
</html>
