<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>Fantasy Space MUD</title>
    <style>
        html, body { height: 100%; margin: 0; background: #000; color: #ccc; font-family: 'Consolas', monospace; overflow: hidden; }
        #wrapper { display: grid; grid-template-areas: "cmds look socials" "send send send"; grid-template-rows: 1fr 60px; grid-template-columns: 240px 1fr 240px; height: 100vh; gap: 4px; }
        #cmds-area { grid-area: cmds; background: #1a1a1a; border: 1px solid #333; overflow-y: auto; padding: 10px; }
        #socials-area { grid-area: socials; background: #1a1a1a; border: 1px solid #333; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        #look-area { grid-area: look; background: #000; border: 1px solid #4CAF50; overflow-y: auto; padding: 20px; font-size: 18px; line-height: 1.6; position: relative; }
        #send-area { grid-area: send; background: #222; display: flex; align-items: center; padding: 0 15px; gap: 10px; position: relative; }
        #info-area { background: #1a1a1a; border: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .stat-box { background: #222; border-radius: 4px; padding: 8px 12px; border-left: 4px solid #4CAF50; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-value { font-weight: bold; color: #fff; display: block; font-size: 16px; }
        .cmd-group { margin-bottom: 15px; }
        .cmd-cat { cursor: pointer; color: #4CAF50; font-weight: bold; margin-bottom: 5px; display: block; }
        .cmd-cat::before { content: '▶ '; display: inline-block; transition: transform 0.2s; }
        .cmd-cat.open::before { transform: rotate(90deg); }
        .cmd-list { display: none; padding-left: 10px; }
        .cmd-list.open { display: block; }
        .cmd-row { display: flex; margin-bottom: 4px; gap: 4px; }
        .btn-cmd { flex: 1; background: #333; color: #00ff00; border: 1px solid #444; padding: 4px; cursor: pointer; text-align: left; }
        .btn-help { background: #444; color: #fff; border: none; padding: 4px 8px; cursor: help; border-radius: 2px; }
        .btn-social { 
            background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 4px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; transition: background 0.2s; 
            aspect-ratio: 1 / 1; font-size: 20px; 
        }
        .btn-social:hover { background: #3a3a3a; border-color: #4CAF50; }
        #socials-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        #msg { flex: 1; background: #000; border: 1px solid #4CAF50; color: #00ff00; padding: 10px; font-size: 18px; outline: none; }
        #suggestion-box { position: absolute; bottom: 60px; left: 15px; right: 15px; background: rgba(30, 30, 30, 0.95); border: 1px solid #4CAF50; border-bottom: none; max-height: 200px; overflow-y: auto; display: none; z-index: 1000; }
        .suggest-item { padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .suggest-item:hover, .suggest-item.active { background: #4CAF50; color: #fff; }
        .suggest-hint { color: #888; font-size: 12px; }
        #minimap-container { position: sticky; float: right; top: 0; right: 0; background: rgba(30, 30, 30, 0.9); border: 1px solid #4CAF50; border-radius: 8px; padding: 10px; display: grid; grid-template-columns: repeat(5, 30px); grid-template-rows: repeat(5, 30px); gap: 4px; z-index: 100; margin-left: 20px; display: none; }
        .map-cell { background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555; }
        .map-room { background: #444; }
        .map-center { background: #1976D2; color: #fff; }
        .map-exit { cursor: pointer; }
        .cmd-link { color: #4CAF50; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .space-bg { background: linear-gradient(to bottom, #000000 0%, #020107 100%) !important; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite; pointer-events: none; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
        .weather-particle { pointer-events: none; z-index: 50; }
    </style>
</head>
<body class="space-bg">
<div id="wrapper">
    <div id="cmds-area">Loading...</div>
    <div id="look-area"><div id="minimap-container"></div><div id="look-content"></div></div>
    <div id="sidebar-right" style="display: flex; flex-direction: column; gap: 4px; overflow: hidden;">
        <div id="info-area"></div>
        <div id="socials-area"></div>
    </div>
    <div id="send-area">
        <div id="suggestion-box"></div>
        <input id="msg" placeholder="Type command..." autocomplete="off" autofocus>
        <button onclick="sendMsg()" id="btn-send">Send</button>
    </div>
</div>
<script>
    let ws, historyCmds = [], histIdx = -1, msgInput, suggestIdx = -1;
    window.onload = () => {
        msgInput = document.getElementById("msg");
        initLocalization();
        initInputHandlers();
        connect();
        initStars();
    };
    function initLocalization() {
        const isZH = (navigator.language || navigator.userLanguage).startsWith('zh');
        if (isZH) {
            document.getElementById("cmds-area").innerText = "載入中...";
            msgInput.placeholder = "輸入指令...";
            document.getElementById("btn-send").innerText = "發送";
        }
    }
    function initInputHandlers() {
        msgInput.oninput = () => {
            const val = msgInput.value, box = document.getElementById("suggestion-box");
            let list = [];

            if (val.startsWith(":")) {
                // 🚀 社交動作搜尋 (Emotes)
                const s = val.substring(1).toLowerCase();
                for (let k in window.allSocials) {
                    if (k.startsWith(s)) {
                        list.push({ v: ":" + k, sv: k, h: window.allSocials[k].label, i: window.allSocials[k].icon, raw: k });
                    }
                }
                list.sort((a, b) => a.raw.localeCompare(b.raw));
            } else if (val.startsWith("/")) {
                // 🚀 系統指令搜尋 (Commands)
                const s = val.substring(1).toLowerCase();
                for (let c in window.allCommands) {
                    window.allCommands[c].forEach(v => {
                        if (v.startsWith(s)) {
                            list.push({ v: "/" + v, sv: v, h: c, i: "⚙️" });
                        }
                    });
                }
                list.sort((a, b) => a.v.localeCompare(b.v));
            }

            if (list.length > 0) renderSuggestions(list);
            else { box.style.display = "none"; suggestIdx = -1; }
        };
        msgInput.onkeydown = (e) => {
            const box = document.getElementById("suggestion-box"), items = box.querySelectorAll(".suggest-item");
            if (box.style.display === "block") {
                if (e.key === "ArrowDown") { e.preventDefault(); suggestIdx = (suggestIdx + 1) % items.length; updateSuggestActive(items); return; }
                if (e.key === "ArrowUp") { e.preventDefault(); suggestIdx = (suggestIdx - 1 + items.length) % items.length; updateSuggestActive(items); return; }
                if (e.key === "Enter" && suggestIdx >= 0) { e.preventDefault(); items[suggestIdx].click(); return; }
                if (e.key === "Escape") { box.style.display = "none"; suggestIdx = -1; return; }
            }
            if (e.key === "ArrowUp") { if (histIdx > 0) { histIdx--; msgInput.value = historyCmds[histIdx]; } }
            else if (e.key === "ArrowDown") { if (histIdx < historyCmds.length - 1) { histIdx++; msgInput.value = historyCmds[histIdx]; } else { histIdx = historyCmds.length; msgInput.value = ""; } }
            else if (e.key === "Enter") sendMsg();
        };
    }
    function renderSuggestions(list) {
        const box = document.getElementById("suggestion-box");
        box.innerHTML = "";
        list.slice(0, 50).forEach((item, idx) => {
            const div = document.createElement("div");
            div.className = "suggest-item";
            if (idx === suggestIdx) div.classList.add("active");
            div.innerHTML = `<span>${item.i || ''} <b>${item.v}</b></span><span class="suggest-hint">${item.h}</span>`;
            div.onclick = () => { msgInput.value = item.sv + " "; box.style.display = "none"; suggestIdx = -1; msgInput.focus(); };
            box.appendChild(div);
        });
        box.style.display = "block";
    }    function updateSuggestActive(items) {
        items.forEach((it, idx) => it.classList.toggle("active", idx === suggestIdx));
    }
    function renderSocials(socials, title) {
        const area = document.getElementById("socials-area");
        area.innerHTML = `<h4>${title || "🎭 Actions"}</h4><div id='socials-grid'></div>`;
        const grid = document.getElementById("socials-grid");
        for (let k in socials) {
            const btn = document.createElement("button");
            btn.className = "btn-social";
            btn.onclick = () => sendCmd(k);
            btn.innerHTML = `<span>${socials[k].icon}</span>`;
            btn.title = k + ": " + socials[k].label;
            grid.appendChild(btn);
        }
    }
    function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(protocol + "//" + location.host + "/ws");
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === "mud_text") {
                const p = msg.payload.trim();
                if (p === "__INPUT_HIDDEN__") { msgInput.type = "password"; return; }
                if (p.startsWith("{") && p.endsWith("}")) { 
                    try { 
                        handleUIData(JSON.parse(p)); 
                    } catch (err) { 
                        try {
                            const fixedP = p.replace(/\}\s*\{/g, "}\n{");
                            const lines = fixedP.split('\n');
                            let allParsed = true;
                            let parsedLines = [];
                            for (let line of lines) {
                                line = line.trim();
                                if (line.startsWith("{") && line.endsWith("}")) {
                                    parsedLines.push(JSON.parse(line));
                                } else if (line) {
                                    allParsed = false; break;
                                }
                            }
                            if (allParsed && parsedLines.length > 0) {
                                parsedLines.forEach(d => handleUIData(d));
                            } else {
                                appendLook(p);
                            }
                        } catch (err2) {
                            appendLook(p);
                        }
                    } 
                }
                else appendLook(p);
            }
        };
    }
    function handleUIData(ui) {
        if (ui.ui === "score") {
            const d = ui.data;
            document.getElementById("info-area").innerHTML = `<div class="stat-box"><span class="stat-label">❤️ HP</span><span class="stat-value">${d.hp}/${d.max_hp}</span></div><div class="stat-box"><span class="stat-label">✨ MP</span><span class="stat-value">${d.mp}/${d.max_mp}</span></div><div class="stat-box"><span class="stat-label">💰 GOLD</span><span class="stat-value">${parseColorTags(d.money)}</span></div>`;
        } else if (ui.ui === "commands") { renderCmdList(ui.data, ui.title); window.allCommands = ui.data; }
        else if (ui.ui === "socials") { renderSocials(ui.data, ui.title); window.allSocials = ui.data; }
        else if (ui.ui === "minimap") renderMiniMap(ui.data);
        else if (ui.ui === "nature") handleNatureData(ui.data);
    }
    function handleNatureData(d) {
        document.body.style.background = d.is_day ? "linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d)" : "linear-gradient(to bottom, #000000, #0f0c29, #000000)";
        renderWeatherEffect(d.weather);
    }
    function renderWeatherEffect(w) {
        const c = document.getElementById("look-area");
        c.querySelectorAll(".weather-particle").forEach(p => p.remove());
        if (w === "clear" || w === "cloudy") return;
        let char = w === "rainy" ? "│" : (w === "snowy" ? "❄" : "·");
        if (w === "foggy") { c.style.filter = "blur(2px)"; return; } else c.style.filter = "none";
        for (let i = 0; i < 20; i++) {
            const p = document.createElement("div"); p.className = "weather-particle"; p.innerText = char; p.style.position = "absolute"; p.style.left = Math.random() * 100 + "%"; p.style.top = "-20px";
            const dur = Math.random() * 2 + 1; p.style.transition = `top ${dur}s linear, opacity ${dur}s ease-in`;
            c.appendChild(p); setTimeout(() => { p.style.top = "100%"; p.style.opacity = "0"; }, 100); setTimeout(() => p.remove(), dur * 1000 + 200);
        }
    }
    function renderCmdList(cats, title) {
        const area = document.getElementById("cmds-area");
        area.innerHTML = `<h4>${title || "📜 Commands"}</h4>`;
        for (let c in cats) {
            let group = document.createElement("div"); group.className = "cmd-group";
            let cat = document.createElement("span"); cat.className = "cmd-cat"; cat.innerText = c;
            let list = document.createElement("div"); list.className = "cmd-list";
            
            cat.onclick = () => { cat.classList.toggle("open"); list.classList.toggle("open"); };
            
            cats[c].forEach(cmd => {
                let row = document.createElement("div"); row.className = "cmd-row";
                row.innerHTML = `<button class="btn-cmd" onclick="fillInput('${cmd}')">${cmd}</button>`;
                list.appendChild(row);
            });
            group.appendChild(cat);
            group.appendChild(list);
            area.appendChild(group);
        }
    }
    function renderMiniMap(d) {
        const m = document.getElementById("minimap-container");
        if (!d.grid) return;
        let html = ""; const exits = new Set(d.exits || []);
        for (let y = 0; y < d.grid.length; y++) {
            for (let x = 0; x < d.grid[y].length; x++) {
                const cell = d.grid[y][x]; let content = "", classes = "map-cell map-" + cell, onClick = "";
                if (cell === "player") { content = "👤"; classes += " map-center"; }
                const dx = x - 2, dy = y - 2; let dir = (dx === 0 && dy === -1) ? "north" : (dx === 0 && dy === 1) ? "south" : (dx === -1 && dy === 0) ? "west" : (dx === 1 && dy === 0) ? "east" : "";
                if (dir && exits.has(dir) && cell !== "void") { classes += " map-exit"; onClick = `onclick="sendCmd('go ${dir}')"`; content = {north:"⬆️",south:"⬇️",west:"⬅️",east:"➡️"}[dir]; }
                html += `<div class="${classes}" ${onClick}>${content}</div>`;
            }
        }
        m.innerHTML = html; m.style.display = "grid";
    }
    function sendCmd(cmd) {
        if (!cmd) return; historyCmds.push(cmd); histIdx = historyCmds.length;
        ws.send(JSON.stringify({ type: "cmd", payload: cmd }));
        appendLook("<span style='color: #888;'>>> " + (msgInput.type === "password" ? "******" : cmd) + "</span>");
    }
    function fillInput(c) { msgInput.value = c + " "; msgInput.focus(); }
    function askHelp(c) { ws.send(JSON.stringify({ type: "cmd", payload: "help " + c })); }
    function appendLook(t) {
        const area = document.getElementById("look-area"), content = document.getElementById("look-content");
        let p = t; const hasTags = /<[a-z/][^>]*>/i.test(t);
        if (hasTags) p = p.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gmi, " [Blocked] ").replace(/\bon\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]*)/gmi, "");
        else p = p.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        p = parseColorTags(p).replace(/\[(.*?)\]/g, (m, p1) => {
            let pts = p1.split('|'), d = pts[0], c = pts.length > 1 ? pts[1] : pts[0];
            return `<span class="cmd-link" onclick="sendCmd('${c.replace(/'/g, "\\'")}')">${d}</span>`;
        });
        const div = document.createElement("div"); if (!hasTags) div.style.whiteSpace = "pre-wrap";
        div.innerHTML = p; content.appendChild(div); setTimeout(() => { area.scrollTop = area.scrollHeight; }, 10);
    }
    function parseColorTags(t) {
        const cmap = { 'r': '#ff5555', 'g': '#55ff55', 'b': '#5555ff', 'y': '#ffff55', 'c': '#55ffff', 'm': '#ff55ff', 'w': '#ffffff', 'gr': '#888888', 'n': 'inherit' };
        let open = 0; let res = t.replace(/\{([rgbymcwgn]|gr)\}/g, (m, tag) => {
            if (tag === 'n') { let s = ''; while (open > 0) { s += '</span>'; open--; } return s; }
            if (cmap[tag]) { open++; return `<span style="color: ${cmap[tag]}">`; } return m;
        });
        while (open > 0) { res += '</span>'; open--; } return res;
    }
    function initStars() {
        const area = document.getElementById("look-area");
        for (let i = 0; i < 40; i++) {
            const s = document.createElement("div"); s.className = "star";
            const sz = (Math.random() * 2 + 1) + "px"; s.style.width = sz; s.style.height = sz;
            s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
            s.style.setProperty("--duration", (Math.random() * 3 + 2) + "s"); area.appendChild(s);
        }
    }
    function sendMsg() {
        const v = msgInput.value.trim(); if (!v) return;
        sendCmd(v); msgInput.value = ""; msgInput.type = "text"; msgInput.focus();
    }
    document.addEventListener('click', (e) => {
        if (['INPUT','BUTTON','A'].includes(e.target.tagName) || e.target.classList.contains('cmd-link') || e.target.classList.contains('map-exit')) return;
        if (!window.getSelection().toString() && msgInput) msgInput.focus();
    });
</script>
</body>
</html>
