<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>Fantasy Space MUD</title>
    <style>
        /* 1. CSS Grid 多區塊佈局 */
        html, body { height: 100%; margin: 0; background: #000; color: #ccc; font-family: 'Consolas', monospace; overflow: hidden; }
        
        #wrapper {
            display: grid;
            grid-template-areas: 
                "cmds look info"
                "send send send";
            grid-template-rows: 1fr 60px;
            grid-template-columns: 240px 1fr 240px;
            height: 100vh;
            gap: 4px;
        }

        #info-area { grid-area: info; background: #1a1a1a; border: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        #cmds-area { grid-area: cmds; background: #1a1a1a; border: 1px solid #333; overflow-y: auto; padding: 10px; }
        /* 🚩 Look 區必須設定 position: relative，讓小地圖可以在裡面絕對定位 */
        #look-area { grid-area: look; background: #000; border: 1px solid #4CAF50; overflow-y: auto; padding: 20px; font-size: 18px; line-height: 1.6; position: relative; }
        #send-area { grid-area: send; background: #222; display: flex; align-items: center; padding: 0 15px; gap: 10px; }

        .stat-box { background: #222; border-radius: 4px; padding: 8px 12px; border-left: 4px solid #4CAF50; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-value { font-weight: bold; color: #fff; display: block; font-size: 16px; }

        .cmd-group { margin-bottom: 15px; }
        .cmd-row { display: flex; margin-bottom: 4px; gap: 4px; }
        .btn-cmd { flex: 1; background: #333; color: #00ff00; border: 1px solid #444; padding: 4px; cursor: pointer; text-align: left; }
        .btn-help { background: #444; color: #fff; border: none; padding: 4px 8px; cursor: help; border-radius: 2px; }
        
        #msg { flex: 1; background: #000; border: 1px solid #4CAF50; color: #00ff00; padding: 10px; font-size: 18px; outline: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; }

        /* 🚀 迷你地圖專用樣式 */
        #minimap-container {
            position: sticky; /* 改用 sticky 讓它在滾動時儘量留在頂部 */
            float: right;
            top: 0;
            right: 0;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
            margin-left: 20px;
            margin-bottom: 20px;
        }

        .map-cell { background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555; user-select: none; }
        .map-exit { background: #2E7D32; cursor: pointer; color: #fff; font-weight: bold; transition: background 0.2s; }
        .map-exit:hover { background: #4CAF50; }
        .map-center { background: #1976D2; color: #fff; border-color: #64B5F6; font-size: 18px; }

        /* 點擊指令樣式 */
        .cmd-link { color: #4CAF50; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .cmd-link:hover { color: #8BC34A; }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="cmds-area">載入指令中...</div>
    <div id="look-area">
        <div id="minimap-container"></div>
        <div id="look-content"></div>
    </div>
    <div id="info-area">等待狀態更新...</div>
    <div id="send-area">
        <input id="msg" placeholder="輸入指令..." autocomplete="off">
        <button onclick="sendMsg()">發送</button>
    </div>
</div>

<script>
    let ws;
    let historyCmds = [];
    let histIdx = -1;

    window.onload = () => { connect(); };

    const msgInput = document.getElementById("msg");
    msgInput.onkeydown = (e) => {
        if (e.key === "ArrowUp") {
            if (histIdx > 0) { histIdx--; msgInput.value = historyCmds[histIdx]; }
        } else if (e.key === "ArrowDown") {
            if (histIdx < historyCmds.length - 1) { histIdx++; msgInput.value = historyCmds[histIdx]; }
            else { histIdx = historyCmds.length; msgInput.value = ""; }
        } else if (e.key === "Enter") {
            sendMsg();
        }
    };

    function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(protocol + "//" + location.host + "/ws");
        
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "mud_text") {
                const payload = msg.payload.trim();

                if (payload === "__INPUT_HIDDEN__") {
                    msgInput.type = "password";
                    return;
                }

                if (payload.startsWith("{") && payload.endsWith("}")) {
                    try {
                        const uiData = JSON.parse(payload);
                        handleUIData(uiData);
                    } catch (e) { appendLook(payload); }
                } else {
                    appendLook(payload);
                }
            }
        };
    }

    function handleUIData(ui) {
        if (ui.ui === "score") {
            const data = ui.data;
            document.getElementById("info-area").innerHTML = `
                <div class="stat-box"><span class="stat-label">❤️ HP</span><span class="stat-value">${data.hp}/${data.max_hp}</span></div>
                <div class="stat-box"><span class="stat-label">✨ MP</span><span class="stat-value">${data.mp}/${data.max_mp}</span></div>
                <div class="stat-box"><span class="stat-label">💰 GOLD</span><span class="stat-value">${data.gold}</span></div>
                <div class="stat-box"><span class="stat-label">⚔️ ATK</span><span class="stat-value">${data.atk}</span></div>
            `;
        } else if (ui.ui === "cmd_list") {
            renderCmdList(ui.data);
        } else if (ui.ui === "minimap") {
            renderMiniMap(ui.data); 
        }
    }

    function renderCmdList(categories) {
        const area = document.getElementById("cmds-area");
        area.innerHTML = "<h4>📜 指令列表</h4>";
        for (let cat in categories) {
            let div = document.createElement("div");
            div.className = "cmd-group";
            div.innerHTML = `<b>${cat}</b>`;
            categories[cat].forEach(cmd => {
                let row = document.createElement("div");
                row.className = "cmd-row";
                row.innerHTML = `
                    <button class="btn-cmd" onclick="fillInput('${cmd}')">${cmd}</button>
                    <button class="btn-help" title="查看說明" onclick="askHelp('${cmd}')">?</button>
                `;
                div.appendChild(row);
            });
            area.appendChild(div);
        }
    }

    function renderMiniMap(data) {
        const mapDiv = document.getElementById("minimap-container");
        const exits = new Set(data.exits);
        
        const layout = [
            "nw", "north", "ne",
            "west", "center", "east",
            "sw", "south", "se"
        ];

        let html = "";
        layout.forEach(dir => {
            if (dir === "center") {
                html += `<div class="map-cell map-center" title="${data.center_name}">👤</div>`;
            } else if (exits.has(dir)) {
                const label = getDirLabel(dir);
                // 🚩 修改：點擊小地圖時送出 "go 方向"
                html += `<div class="map-cell map-exit" onclick="sendCmd('go ${dir}')">${label}</div>`;
            } else {
                html += `<div class="map-cell"></div>`;
            }
        });

        mapDiv.innerHTML = html;
        mapDiv.style.display = "grid";
    }

    function getDirLabel(dir) {
        const labels = { north:"北", south:"南", east:"東", west:"西", up:"上", down:"下" };
        return labels[dir] || dir.substring(0, 1).toUpperCase();
    }

    function sendCmd(cmd) {
        historyCmds.push(cmd);
        histIdx = historyCmds.length;
        ws.send(JSON.stringify({ type: "cmd", payload: cmd }));
        
        // 🚩 修正：如果目前是密碼輸入模式，日誌顯示星號
        const displayVal = msgInput.type === "password" ? "******" : cmd;
        appendLook("<span style='color: #888;'>>> " + displayVal + "</span>");
    }

    function fillInput(cmd) {
        msgInput.value = cmd + " ";
        msgInput.focus();
    }

    function askHelp(cmd) {
        ws.send(JSON.stringify({ type: "cmd", payload: "help " + cmd }));
    }

    function appendLook(text) {
        const area = document.getElementById("look-area");
        const content = document.getElementById("look-content");
        
        // 處理 [指令] 格式，轉化為可點擊連結
        let formattedText = text.replace(/\[(.*?)\]/g, (match, cmd) => {
            return `<span class="cmd-link" onclick="sendCmd('${cmd}')">${match}</span>`;
        });

        const newMsg = document.createElement("div");
        newMsg.innerHTML = formattedText.replace(/\n/g, "<br>");
        
        content.appendChild(newMsg);
        area.scrollTop = area.scrollHeight;
    }

    function sendMsg() {
        const val = msgInput.value.trim();
        if (!val) return;
        sendCmd(val);
        msgInput.value = "";
        msgInput.type = "text";
        msgInput.focus();
    }
</script>
</body>
</html>
