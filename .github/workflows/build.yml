name: MudScript Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MudScript
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2' # 與專案 go.mod 一致

    - name: Install Windows Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64

    - name: Build Linux Version
      run: |
        mkdir -p bin
        go build -ldflags="-s -w" -o bin/fsmud ./cmd/fsmud

    - name: Build Windows Version
      run: |
        CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC="x86_64-w64-mingw32-gcc" \
        go build -ldflags="-s -w" -o bin/fsmud.exe ./cmd/fsmud

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mudscript-binaries
        path: bin/
