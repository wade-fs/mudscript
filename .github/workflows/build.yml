name: MudScript Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build MudScript
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'
        cache: false # 暫時關閉快取以避免 go.sum 缺失造成的錯誤

    - name: Install Windows Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64

    - name: Tidy Go Modules
      run: go mod tidy

    - name: Build Linux Version
      run: |
        mkdir -p bin
        go build -ldflags="-s -w" -o bin/fsmud ./cmd/fsmud

    - name: Build Windows Version
      run: |
        CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC="x86_64-w64-mingw32-gcc" \
        go build -ldflags="-s -w" -o bin/fsmud.exe ./cmd/fsmud

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mudscript-binaries
        path: bin/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/fsmud
          bin/fsmud.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
