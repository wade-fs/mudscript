name: MudScript Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build MudScript
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'
        cache: false

    - name: Install Windows Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64

    - name: Run MudScript Core Tests
      run: |
        go mod tidy
        make fsmud
        MUD_TEST_MODE=1 ./bin/fsmud --hub none

    - name: Build All Targets
      run: |
        # 使用 Makefile 編譯所有版本
        make fsmud fsmud.exe fs fs.exe mud-universal mud-universal.exe mudscript mudscript.exe

    - name: Package Binaries
      run: |
        # 取得 Tag 名稱
        TAG_NAME=${GITHUB_REF#refs/tags/}
        if [ "$TAG_NAME" = "$GITHUB_REF" ]; then TAG_NAME="latest"; fi
        
        # 打包 Linux 版本 (.tar.gz)
        tar -czf mudscript-linux-${TAG_NAME}.tar.gz -C bin fsmud fs mud-universal mudscript
        
        # 打包 Windows 版本 (.zip)
        cd bin
        zip ../mudscript-windows-${TAG_NAME}.zip fsmud.exe fs.exe mud-universal.exe mudscript.exe
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mudscript-binaries
        path: |
          mudscript-linux-*.tar.gz
          mudscript-windows-*.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          mudscript-linux-*.tar.gz
          mudscript-windows-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
